services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    container_name: oracle-ordenes
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: ordenes
      APP_USER_PASSWORD: ordenes
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: ms-ordenes-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: ordenes
      DB_PASSWORD: ordenes
      JWT_SECRET: ms-ordenes-transporte-clave-secreta-docker-2026-pQ7mZxK9
      APP_USERNAME: admin
      APP_PASSWORD: admin123
      STORAGE_PATH: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
  uploads-data: