spring.application.name=ms-gestion-ordenes-transporte
server.port=8080

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USER:ordenes}
spring.datasource.password=${DB_PASSWORD:ordenes}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.storage.location=${STORAGE_PATH:./uploads}

app.jwt.secret=${JWT_SECRET:ms-ordenes-transporte-clave-secreta-desarrollo-2026-xK9pQ7mZ}
app.jwt.expiration-ms=3600000

logging.structured.format.console=ecs
logging.level.com.movilidad.ordenes=DEBUG

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info